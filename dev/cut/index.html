<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cut — trace the chupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16151a; --bg-2: #1e1c23; --bone: #e9e3d5;
    --bone-dim: #9b958a; --madder: #b3282d; --line: #2e2c34;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--bone);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  header { padding: 16px 22px 8px; display: flex; align-items: baseline; gap: 14px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--madder); }
  h1 { font-family: "Fraunces", serif; font-weight: 560; font-size: 24px; }
  h1 .tib { color: var(--bone-dim); font-weight: 400; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .readout {
    position: absolute; right: 20px; top: 12px; text-align: right;
    font-size: 10.5px; color: var(--bone-dim); line-height: 1.8; pointer-events: none;
  }
  .readout b { color: var(--bone); font-weight: 500; }
  .hint {
    position: absolute; left: 22px; bottom: 12px; font-size: 11px;
    color: var(--bone-dim); letter-spacing: 0.06em; pointer-events: none; max-width: 60%;
  }
  .hint b { color: var(--bone); font-weight: 500; }
  footer {
    border-top: 1px solid var(--line); background: var(--bg-2);
    padding: 10px 20px 14px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;
  }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bone-dim); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .tbtn {
    background: none; border: 1px solid var(--line); border-radius: 7px;
    color: var(--bone-dim); font-family: inherit; font-size: 11px;
    padding: 6px 10px; cursor: pointer; display: flex; align-items: center; gap: 7px;
  }
  .tbtn:hover { color: var(--bone); border-color: var(--bone-dim); }
  .tbtn.on { color: var(--bone); border-color: var(--bone); background: rgba(233, 227, 213, 0.06); }
  .tbtn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .tbtn .n { color: var(--bone-dim); font-size: 10px; }
  .tbtn.go { color: var(--madder); border-color: var(--madder); }
  .tbtn.go:hover { background: rgba(179, 40, 45, 0.12); }
  @media (max-width: 860px) { .readout { display: none; } footer { gap: 12px; } }
</style>

<body>

<header>
  <div class="eyebrow">Chupa designer · the cut</div>
  <h1>Trace <span class="tib">ཚེམ་དཔེ།</span></h1>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="readout" id="readout"></div>
  <div class="hint" id="hint"></div>
</div>

<footer>
  <div class="group">
    <div class="label">Draw</div>
    <div class="row" id="layers"></div>
  </div>
  <div class="grow"></div>
  <div class="group">
    <div class="label">Show</div>
    <div class="row">
      <button class="tbtn on" id="figureBtn">figure</button>
      <button class="tbtn on" id="currentBtn">current build</button>
      <button class="tbtn on" id="gridBtn">grid</button>
    </div>
  </div>
  <div class="group">
    <div class="label">Trace</div>
    <div class="row">
      <button class="tbtn" id="clearBtn">clear layer</button>
      <button class="tbtn" id="clearAllBtn">clear all</button>
      <button class="tbtn go" id="saveBtn">save to panels.json</button>
    </div>
  </div>
</footer>

</body>
</html>
