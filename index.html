<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* -----------------------------------------------------------------------
     A dressing room, not a dev tool.

     The page used to be a dark stage in monospace with hex codes shouted on
     every swatch — it read as a terminal, which is the wrong invitation for
     someone choosing what to wear. So: warm paper, ink instead of bone, one
     friendly sans for the interface and Fraunces for anything that names a
     thing. Nothing is smaller than 11px, nothing tappable is under 40px, and
     the hex code is still there — kept quiet, under the name, where a tailor
     can find it and nobody else has to look at it.
     ----------------------------------------------------------------------- */
  :root {
    --paper: #f6f1e8;      /* the room */
    --card: #fffdf9;       /* anything raised off it */
    --ink: #2f2a25;
    --ink-2: #6f665c;
    --ink-3: #a2988c;
    --line: #e6ddcf;
    --line-2: #d6c9b5;
    --madder: #b3282d;
    --r: 16px;
    --shadow: 0 1px 2px rgba(74,60,44,0.05), 0 8px 22px -14px rgba(74,60,44,0.35);
    --shadow-lift: 0 2px 4px rgba(74,60,44,0.06), 0 14px 30px -16px rgba(74,60,44,0.45);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #f9f5ee 0%, var(--paper) 34%, #f1e9dc 100%);
    color: var(--ink);
    font-family: "Nunito Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.45;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  /* Header ---------------------------------------------------------------- */
  header {
    padding: 16px 28px 12px; display: flex; align-items: baseline; gap: 12px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 27px;
    letter-spacing: -0.01em;
  }
  h1 .tib { color: var(--ink-3); font-weight: 400; font-size: 21px; margin-left: 5px; }
  header .sub { font-size: 13.5px; color: var(--ink-2); }

  /* On a wide screen the panels float over the room; on a phone they drop
     below it and the whole page scrolls. They are siblings of the stage rather
     than children of it, so the same markup does both. */
  #main { flex: 1; position: relative; min-height: 0; }
  #stage { position: absolute; inset: 0; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }

  /* Floating panels ------------------------------------------------------- */
  .panel {
    position: absolute; top: 12px; bottom: 12px;
    /* Slightly sheer, so the room shows through and the panels read as glass
       laid over the photograph rather than as two opaque boxes cropping it. */
    background: rgba(255,253,249,0.88);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.7); border-radius: 18px;
    box-shadow: var(--shadow-lift);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel .scroll {
    overflow-y: auto; overscroll-behavior: contain;
    scrollbar-width: thin; scrollbar-color: var(--line-2) transparent;
    padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }
  .panel .scroll > * { flex: 0 0 auto; }
  /* `display: flex` above beats the browser's own `[hidden] { display: none }`,
     so a hidden pane stayed on screen under the visible one. */
  .panel .scroll[hidden] { display: none; }
  .cards { left: 16px; width: 232px; }
  /* Back on the right, where the palette column was. Full height again now
     that it carries the suggestions as well as the combinations — the answer
     to "what goes with this" needs the room, and it must stay on screen while
     the wheel is open on the other side. */
  .combos { right: 16px; width: 288px; }
  .rule { height: 1px; background: var(--line); margin: 2px 0; }

  .eyebrow {
    font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 500;
  }
  .eyebrow .hint { font-family: inherit; }
  .hint { font-family: "Nunito Sans", sans-serif; font-size: 12px; color: var(--ink-2); }

  /* The two garment cards ------------------------------------------------- */
  .card {
    display: block; width: 100%; padding: 0; cursor: pointer; text-align: left;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 14px;
    overflow: hidden; transition: border-color 140ms, transform 140ms, box-shadow 140ms;
  }
  .card + .card { margin-top: -4px; }
  .card:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow); }
  .card.on { border-color: var(--madder); box-shadow: var(--shadow-lift); }
  /* The ring is what keeps a pale cloth from dissolving into the white card —
     bone on ivory has no edge of its own. */
  .swatch {
    display: block; height: 76px; position: relative;
    box-shadow: inset 0 0 0 1px rgba(74,60,44,0.10);
  }
  /* The cloth and the code share the last line — the code used to float in the
     corner, which was fine when nothing else was down there. */
  .card .meta {
    display: grid; grid-template-columns: 1fr auto; gap: 1px 8px;
    padding: 9px 13px 11px; position: relative; align-items: baseline;
  }
  .slotname, .cname, .ctone { grid-column: 1 / -1; }
  .slotname {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3);
  }
  .card.on .slotname { color: var(--madder); }
  .card.open .slotname::after { content: " · editing"; }
  /* A chevron on the cloth, so it is obvious the card opens. It points down
     when closed and up when the wheel is out below it. */
  .chev {
    position: absolute; right: 10px; bottom: 10px; width: 26px; height: 26px;
    border-radius: 50%; background: rgba(255,253,249,0.9); color: var(--ink-2);
    display: grid; place-items: center; font-size: 11px; line-height: 1;
    box-shadow: 0 1px 4px rgba(74,60,44,0.22); transition: transform 160ms;
  }
  .card.open .chev { transform: rotate(180deg); }
  .cname {
    font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 19px;
    line-height: 1.15; letter-spacing: -0.01em;
  }
  .ctone { font-size: 12.5px; color: var(--ink-2); }
  .cloth-line { font-size: 11.5px; color: var(--ink-2); margin-top: 3px; }
  /* The code, kept for the tailor and out of everyone else's way. */
  .hex {
    justify-self: end; white-space: nowrap; margin-top: 3px;
    font-size: 11px; letter-spacing: 0.04em; color: var(--ink-3);
  }

  /* Tabs ------------------------------------------------------------------- */
  .tabs {
    display: flex; gap: 4px; padding: 10px 12px 0; flex: 0 0 auto;
    border-bottom: 1px solid var(--line);
  }
  .tab {
    flex: 1; background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 7px 6px 8px; cursor: pointer; color: var(--ink-3);
    font-family: "Fraunces", Georgia, serif; font-size: 14px; font-weight: 500;
    margin-bottom: -1px; transition: color 130ms, border-color 130ms;
  }
  .tab:hover { color: var(--ink-2); }
  .tab.on { color: var(--ink); border-bottom-color: var(--madder); }
  /* Not disabled — absent. She is not wearing one, so there is nothing to
     choose, and a greyed-out tab is a promise the page cannot keep. */
  .tab[hidden] { display: none; }

  /* The pangden ------------------------------------------------------------ */
  /* Turned on rather than configured: the apron is a separate garment, so the
     checkbox is the question and its whole panel only exists once the answer
     is yes. */
  .pgcheck {
    display: flex; align-items: center; gap: 9px; cursor: pointer;
    padding: 4px 2px; margin-top: -2px;
    border: 1.5px solid transparent; border-radius: 12px;
    transition: background 130ms, border-color 130ms;
  }
  .pgcheck:hover { background: var(--paper); border-color: var(--line); }
  .pgcheck input {
    appearance: none; -webkit-appearance: none; margin: 0;
    width: 19px; height: 19px; flex: 0 0 auto; cursor: pointer;
    border: 1.5px solid var(--line-2); border-radius: 6px; background: var(--card);
    display: grid; place-content: center;
    transition: background 120ms, border-color 120ms;
  }
  .pgcheck input::after {
    content: ""; width: 10px; height: 6px; margin-top: -2px;
    border-left: 2px solid #fffdf9; border-bottom: 2px solid #fffdf9;
    transform: rotate(-45deg) scale(0); transition: transform 130ms ease-out;
  }
  .pgcheck input:checked { background: var(--madder); border-color: var(--madder); }
  .pgcheck input:checked::after { transform: rotate(-45deg) scale(1); }
  .pgcheck:hover input { border-color: var(--madder); }
  .pgname {
    font-family: "Fraunces", Georgia, serif; font-size: 15px; font-weight: 500;
  }
  /* Both classes, so this beats `.combowrap` whichever is declared first. The
     apron's chip is wider than a colour chip because it has to show three
     panels of stripes — a single flat square would say nothing about it. */
  .combowrap.pgwrap { grid-template-columns: 42px 1fr; }
  .pgweave {
    display: block; width: 42px; height: 24px; border-radius: 5px;
    box-shadow: inset 0 0 0 1px rgba(74,60,44,0.14);
  }

  /* The dyes --------------------------------------------------------------- */
  /* One chip per DYE, not per band. Every band woven with madder moves
     together across all three panels, because they came out of one pot — so
     the thing you change is the dye, and the chip is the pot. */
  .dyes { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 7px; }
  .dye {
    display: flex; flex-direction: column; gap: 5px; padding: 6px;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 11px;
    cursor: pointer; text-align: left;
    transition: border-color 130ms, box-shadow 130ms, transform 130ms;
  }
  .dye:hover { border-color: var(--line-2); transform: translateY(-1px); box-shadow: var(--shadow); }
  .dye.on { border-color: var(--madder); box-shadow: var(--shadow-lift); }
  .dye i {
    display: block; height: 26px; border-radius: 6px;
    box-shadow: inset 0 0 0 1px rgba(74,60,44,0.14);
  }
  .dye .dn { font-size: 11.5px; font-weight: 600; line-height: 1.15; }
  .dye .dw { font-size: 10.5px; color: var(--ink-3); }
  /* A dye that has been moved off the plant it is named for stops claiming to
     be that plant. */
  .dye.moved .dw { color: var(--madder); }
  /* The code, on every chip and not only the ones still on their plant. An
     apron is three panels of specific colours and a tailor has to be able to
     order them — "moved" is not something you can weave from. */
  .dye .dhex {
    font-size: 10px; letter-spacing: 0.03em; color: var(--ink-3); margin-top: 1px;
  }
  .dyebtns { display: flex; gap: 8px; flex-wrap: wrap; }
  .dyebtns .tbtn[hidden] { display: none; }

  /* Ghost chips while it works the dyes out, the same beat the honju gets. */
  .dye.ghost { cursor: default; pointer-events: none; animation: pulse 1100ms ease-in-out infinite; }
  .dye.ghost i { background: var(--line); }
  .dye.ghost .dn, .dye.ghost .dw, .dye.ghost .dhex {
    background: var(--line); border-radius: 4px; height: 9px; margin-top: 3px;
  }
  .dye.ghost .dn { width: 70%; }
  .dye.ghost .dw { width: 50%; height: 8px; }
  .dye.ghost .dhex { width: 60%; height: 8px; }

  /* The wheel ------------------------------------------------------------- */
  /* The wheel is not furniture — it belongs to whichever card you opened, and
     it moves in the DOM to sit directly under that card. Closed by default: the
     panel opens as a wardrobe, not as a colour tool. */
  .picker {
    position: fixed; z-index: 90; width: 208px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: 14px 12px 16px; background: var(--card);
    border: 1px solid var(--line-2); border-radius: 14px;
    box-shadow: var(--shadow-lift), 0 24px 48px -22px rgba(74,60,44,0.55);
    animation: drop 160ms ease-out;
  }
  .picker[hidden] { display: none; }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .picker { animation: none; } }
  #wheel {
    width: 176px; height: 176px; border-radius: 50%; cursor: crosshair; display: block;
    touch-action: none; box-shadow: 0 2px 10px rgba(74,60,44,0.14);
  }
  .lightrow { display: flex; align-items: center; gap: 9px; width: 100%; padding: 0 4px; }
  .lightrow .cap { font-size: 11px; color: var(--ink-3); }
  #lightness { flex: 1; }
  .pickhint { font-size: 12px; color: var(--ink-2); }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    height: 5px; border-radius: 3px; background: var(--line-2); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 20px; height: 20px;
    border-radius: 50%; background: var(--card); border: 1.5px solid var(--line-2);
    box-shadow: 0 1px 4px rgba(74,60,44,0.28); cursor: pointer;
  }

  /* Suggestions ----------------------------------------------------------- */
  .harmony { display: flex; flex-direction: column; gap: 2px; }
  /* Tighter than it was on the left: the column now carries the combinations
     above it, and eight suggestions at the old row height put the last one
     under the fold on a laptop. */
  .harm {
    display: grid; grid-template-columns: 34px 1fr; gap: 0 10px; align-items: center;
    background: none; border: 1px solid transparent; border-radius: 11px;
    padding: 5px 8px; cursor: pointer; text-align: left;
    transition: background 120ms, border-color 120ms;
  }
  .harm:hover { background: var(--paper); border-color: var(--line); }
  .harm .hc {
    grid-row: 1 / 3; height: 34px; border-radius: 9px;
    border: 1px solid rgba(74,60,44,0.12);
  }
  .harm .hn { font-size: 14px; font-weight: 600; }
  .harm .hnote { font-size: 11.5px; color: var(--ink-2); line-height: 1.3; }
  /* Written out down the list rather than appearing as a block. */
  .harm { animation: harmIn 260ms ease-out both; }
  @keyframes harmIn { from { opacity: 0; transform: translateY(5px); } }

  /* Before anything has been picked, the box says what it is FOR. An empty
     panel reads as a panel with nothing in it; a stated promise reads as a
     panel waiting for you. */
  .empty {
    border: 1.5px dashed var(--line-2); border-radius: 12px;
    padding: 14px 13px; font-size: 12.5px; line-height: 1.45; color: var(--ink-2);
  }
  .empty b { color: var(--ink); font-weight: 700; }

  /* Working it out -------------------------------------------------------- */
  .think {
    display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2);
    font-family: "Nunito Sans", sans-serif; font-size: 12.5px; font-weight: 600;
  }
  /* A hue ring, not a generic loader. The thing being worked out is a colour,
     so the thing that says "working" is made of colour. */
  .spin {
    width: 15px; height: 15px; border-radius: 50%; flex: 0 0 auto;
    background: conic-gradient(#c0392b, #d68910, #b7950b, #1e8449,
                               #1f6f8b, #5b3e90, #a93226, #c0392b);
    -webkit-mask: radial-gradient(circle, transparent 52%, #000 54%);
            mask: radial-gradient(circle, transparent 52%, #000 54%);
    animation: spin 900ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* One ghost per suggestion coming, so the panel does not collapse and then
     shove itself open again when the answer lands. */
  .harm.ghost { cursor: default; pointer-events: none; animation: pulse 1100ms ease-in-out infinite; }
  .harm.ghost .hc { background: var(--line); }
  .harm.ghost .hn, .harm.ghost .hnote {
    background: var(--line); border-radius: 4px; height: 9px; margin: 3px 0;
  }
  .harm.ghost .hn { width: 58%; }
  .harm.ghost .hnote { width: 82%; height: 8px; }
  @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
  /* Under reduced motion the beat is skipped in script; this is the belt to
     that pair of braces — nothing here should ever spin or pulse. */
  @media (prefers-reduced-motion: reduce) {
    .spin, .harm, .harm.ghost { animation: none; }
  }

  /* Ready-made combinations ------------------------------------------------ */
  /* Fifty-one pairs used to be a column of their own down the right of the
     room. As a grid of swatches that is lovely and it is also the widest thing
     on the page, spent on something you use once at the start. Collapsed to a
     dropdown, the room gets the space back.
     What the grid did well was let you SEE a pairing rather than read its name,
     so the two colours stay visible on the chip, and the arrows either side
     walk the list without opening it — flicking through fifty-one pairs on the
     garment itself beats reading fifty-one labels. */
  .comborow { display: grid; grid-template-columns: 24px 1fr 24px; gap: 6px; align-items: center; }
  .step {
    height: 34px; border-radius: 9px; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); color: var(--ink-2);
    font-size: 15px; line-height: 1; padding: 0;
    transition: border-color 120ms, background 120ms, color 120ms;
  }
  .step:hover { border-color: var(--line-2); background: var(--paper); color: var(--ink); }
  .combowrap {
    display: grid; grid-template-columns: 26px 1fr; align-items: center; gap: 7px;
    height: 34px; padding: 0 8px 0 4px; cursor: pointer;
    background: var(--card); border: 1.5px solid var(--line); border-radius: 10px;
    transition: border-color 140ms, box-shadow 140ms;
  }
  .combowrap:hover { border-color: var(--line-2); box-shadow: var(--shadow); }
  .combowrap:focus-within { border-color: var(--madder); }
  /* Two cloths as they sit: the chupa the field, the honju the band across it. */
  .duo {
    display: block; position: relative; border-radius: 6px; overflow: hidden;
    border: 1px solid rgba(74,60,44,0.12); box-shadow: 0 1px 3px rgba(74,60,44,0.10);
  }
  .duo.sm { height: 24px; }
  .duo i { position: absolute; inset: 0; display: block; }
  .duo.sm i.b { inset: auto 0 0 0; height: 8px; }
  /* The native control, stripped to its text. A <select> is used deliberately:
     it is the one dropdown that is already keyboard-navigable, already types
     to search, and already becomes a proper wheel on a phone. */
  #combo, #pgStyle {
    -webkit-appearance: none; appearance: none;
    width: 100%; min-width: 0; border: 0; background: none; outline: none;
    font-family: "Nunito Sans", sans-serif; font-size: 13px; font-weight: 600;
    color: var(--ink); cursor: pointer; padding: 0 14px 0 0;
    text-overflow: ellipsis;
    /* The chevron, drawn rather than imported. */
    background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%),
                      linear-gradient(135deg, var(--ink-3) 50%, transparent 50%);
    background-position: right 4px center, right 0px center;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
  }
  #combo optgroup { font-style: normal; font-weight: 600; color: var(--ink-3); }
  #combo option { font-weight: 500; color: var(--ink); }
  /* The description the grid used to carry under each tile. It keeps the
     sourcing visible — "after a description" is not the same claim as a
     measurement, and that distinction should not be lost to a dropdown. */
  .combonote {
    margin-top: -8px; font-size: 11.5px; line-height: 1.35; color: var(--ink-2);
    min-height: 2.7em;
  }
  .combonote .g { display: block; color: var(--ink-3); }

  /* The bottom bar --------------------------------------------------------- */
  footer { border-top: 1px solid var(--line); background: var(--card); padding: 12px 28px 14px; }
  .wardrobe { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; }

  /* Quiet, and the last thing in the reading order. Credit that shouts is
     branding; credit that is simply present and correct is attribution. */
  .colophon { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .colophon .who { font-size: 12px; color: var(--ink-2); }
  .colophon .src { font-size: 11px; line-height: 1.35; color: var(--ink-3); max-width: 46ch; }

  .grow { flex: 1; }
  .tbtn {
    background: var(--card); border: 1px solid var(--line-2); border-radius: 999px;
    color: var(--ink-2); font-size: 13px; padding: 9px 16px; cursor: pointer;
    transition: border-color 120ms, color 120ms, background 120ms;
  }
  .tbtn:hover { color: var(--ink); border-color: var(--ink-3); }
  .tbtn.on { color: var(--card); background: var(--madder); border-color: var(--madder); }
  .tbtn.go { color: var(--madder); border-color: var(--madder); }
  .quiet { border-color: transparent; background: none; color: var(--ink-3); }

  /* Workshop drawer — the numbers, out of the way until asked for ---------- */
  #advanced {
    margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line);
    display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap;
  }
  #advanced[hidden] { display: none; }
  .slot { display: flex; flex-direction: column; gap: 9px; }
  .slot > .label { font-family: "Fraunces", Georgia, serif; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .knobs { display: grid; grid-template-columns: repeat(3, auto); gap: 5px 20px; }
  .knob { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--ink-2); }
  .knob .n { width: 92px; text-align: right; }
  .knob .v { width: 38px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .knob input[type=range] { width: 92px; }

  /* Phones ---------------------------------------------------------------
     The panels used to be hidden below 1080px, which left a phone with a
     picture of a dress and no way to change it — on the device this is aimed
     at. Now the room takes the top of the screen and everything else stacks
     under it, one column, the page scrolling as a whole. */
  @media (max-width: 1080px) {
    body { overflow: auto; }
    /* `flex: 1` is what makes the panels float on a wide screen; left on here
       it squeezes them all into whatever is left of one viewport, which is how
       the wardrobe ended up as a 6px sliver. Let the column grow instead. */
    #main {
      position: static; flex: 0 0 auto; display: flex; flex-direction: column;
      gap: 12px; padding: 0 12px 12px;
    }
    #stage {
      position: relative; inset: auto; height: 52vh; min-height: 320px;
      border-radius: var(--r); overflow: hidden;
    }
    .panel {
      position: static; top: auto; bottom: auto; width: auto; max-height: none;
    }
    .panel .scroll { overflow: visible; }
    .cards .scroll { display: grid; grid-template-columns: 1fr 1fr; align-items: start; }
    .cards .eyebrow, .cards .picker, .cards .harmony,
    .cards .pgcard { grid-column: 1 / -1; }
    .card + .card { margin-top: 0; }
    /* Stacked, the combination comes straight under the room — it is where you
       start, not something below a wardrobe you have not filled in yet. The
       stage and the combination keep the default order, so pushing the cards
       past both is the whole change. */
    .cards { order: 1; }
    footer { position: sticky; bottom: 0; }
  }
  @media (max-width: 560px) {
    header { flex-direction: column; gap: 2px; padding: 14px 20px 10px; }
    #stage { height: 46vh; }
    .cards .scroll { grid-template-columns: 1fr; }
    /* The footer is one button now, so it stops sticking and stops eating the
       screen. */
    footer { position: static; padding: 10px 16px 12px; }
    .wardrobe { flex-direction: column; align-items: stretch; gap: 10px; }
    .grow { display: none; }
    #advancedBtn { align-self: flex-end; }
    .cname { font-size: 17px; }
  }

<body>

<header>
  <h1>Chupa <span class="tib">ཕྱུ་པ་</span></h1>
  <div class="sub">pick a colour, pick a cloth — she wears it straight away</div>
</header>

<div id="main">
  <div id="stage"><canvas id="c"></canvas></div>

  <div class="panel cards">
    <div class="scroll">
      <div class="eyebrow">What she is wearing</div>

      <button class="card" id="cardChupa" data-slot="chupa">
        <span class="swatch"><span class="chev">▼</span></span>
        <span class="meta">
          <span class="slotname">Chupa</span>
          <span class="cname"></span>
          <span class="ctone"></span>
          <span class="cloth-line"></span>
          <span class="hex"></span>
        </span>
      </button>
      <button class="card" id="cardHonju" data-slot="honju">
        <span class="swatch"><span class="chev">▼</span></span>
        <span class="meta">
          <span class="slotname">Honju</span>
          <span class="cname"></span>
          <span class="ctone"></span>
          <span class="cloth-line"></span>
          <span class="hex"></span>
        </span>
      </button>

      <!-- The pangden is its own garment and optional: woven by other people
           from other wool, tied on last. It belongs here, among the things she
           has on — but it is not a colour card, because you do not choose an
           apron's colour, you choose an apron. Ticking it opens a panel of its
           own across the room. -->
      <label class="pgcheck">
        <!-- Unchecked in the markup as well as in the script, so the box is
             never briefly ticked before the first paint corrects it. -->
        <input type="checkbox" id="pgOn">
        <span class="pgname">Pangden</span>
        <span class="hint">the striped apron</span>
      </label>


    </div>
  </div>

  <!-- The right column is what is OFFERED to you; the left is what she has on.
       The suggestions live here rather than under the cards because the wheel
       opens under the card it belongs to and pushes everything below it off the
       screen — so the one thing that was reacting to your choice was the one
       thing you could not see while making it. -->
  <div class="panel combos">
    <!-- Two garments' worth of choices in one column would be a scroll. The
         chupa and the honju are chosen together — one is picked against the
         other — so they share a tab. The pangden is a different garment on a
         different loom, and it gets its own. -->
    <div class="tabs" id="tabs" role="tablist">
      <button class="tab on" id="tabCloth" role="tab" aria-selected="true">Cloth</button>
      <button class="tab" id="tabPangden" role="tab" aria-selected="false">Pangden</button>
    </div>

    <div class="scroll" id="paneCloth" role="tabpanel">
      <div class="eyebrow">Start from a combination</div>
      <div class="comborow">
        <button class="step" id="comboPrev" aria-label="previous combination">‹</button>
        <label class="combowrap">
          <span class="duo sm" id="comboDuo"><i></i><i class="b"></i></span>
          <select id="combo" aria-label="ready-made combinations"></select>
        </label>
        <button class="step" id="comboNext" aria-label="next combination">›</button>
      </div>
      <div class="combonote" id="comboNote"></div>

      <div class="rule"></div>

      <div class="eyebrow" id="harmonyLabel"></div>
      <div class="harmony" id="harmony"></div>
    </div>

    <div class="scroll" id="panePangden" role="tabpanel" hidden>
      <div class="eyebrow">Which apron</div>
      <div class="comborow">
        <button class="step" id="pgPrev" aria-label="previous apron">‹</button>
        <label class="combowrap pgwrap">
          <canvas id="pgweave" class="pgweave" width="80" height="48"></canvas>
          <select id="pgStyle" aria-label="apron style"></select>
        </label>
        <button class="step" id="pgNext" aria-label="next apron">›</button>
      </div>

      <div class="rule"></div>

      <div class="eyebrow" id="dyeLabel"></div>
      <div class="dyes" id="dyes"></div>
      <div class="dyebtns">
        <button class="tbtn" id="dyeTune">tune to the outfit</button>
        <button class="tbtn quiet" id="dyeReset" hidden>the dyes it was woven with</button>
      </div>
    </div>
  </div>

</div><!-- #main -->

<footer>
  <!-- The two cloth plates that used to sit here said the same four things as
       the cards on the left — name, tone, code, and the cloth — and said them
       second. The cloth line was the only thing they added, so it moved onto
       the cards and the plates went. The spec card this was a rehearsal for is
       still to build; when it exists it is a rendered, shareable thing, not a
       second readout of the panel beside it. -->
  <div class="wardrobe">
    <!-- Whose it is, and where its facts come from. A GunkTech project rather
         than a Terma Heritage Foundation one — the made-to-order angle in
         Phase 6 is a business line and a heritage foundation is the wrong
         container for it — but the research arrow points at Khadog and is
         credited, which is the direction that matters.
         NO DATASET VERSION, deliberately. Khadog pins `tibetan-color-data` at a
         release and prints the version because it genuinely consumes it. This
         page does not: its dye values are interpretations, hand-written here
         from Buckley by way of Khadog's collation. Printing a version would
         claim a provenance that does not exist. When a real pinned extract
         lands, the version goes in beside the credit and the wording changes
         from "after" to "from". -->
    <div class="colophon">
      <span class="who">Chupa Designer · Thupten Chakrishar / GunkTech</span>
      <span class="src">Colour and pangden research after Khadog,
        a project of the Terma Heritage Foundation</span>
    </div>
    <div class="grow"></div>
    <button class="tbtn quiet" id="advancedBtn">adjust the cut</button>
  </div>

  <div id="advanced" hidden>
    <div class="slot grow">
      <div class="label">Shape</div>
      <div class="knobs" id="knobs"></div>
    </div>
    <div class="slot">
      <div class="label">Show</div>
      <div class="row">
        <button class="tbtn" id="collarBtn">collar</button>
        <button class="tbtn" id="sleeveBtn">sleeves</button>
        <button class="tbtn" id="figureBtn">figure</button>
        <button class="tbtn" id="gridBtn">grid</button>
        <button class="tbtn" id="edgeBtn">edges</button>
        <button class="tbtn go" id="saveBtn">save numbers</button>
      </div>
    </div>
  </div>
</footer>

<!-- The wheel floats. It used to be moved in the DOM to sit under whatever it
     belonged to, which is how clicking the chupa could open it under the pangden
     dyes and quietly re-dye the apron instead. A popover cannot land in the
     wrong container, cannot be squeezed into a grid cell, cannot be clipped by a
     panel's overflow, and cannot lose its pointer capture to a re-parent. It is
     a child of the body and is POSITIONED, never moved. -->
<div class="picker" id="picker" hidden>
  <canvas id="wheel" width="176" height="176"></canvas>
  <div class="lightrow">
    <span class="cap">deep</span>
    <input type="range" id="lightness" min="12" max="92" step="1" value="40"
           aria-label="how light the colour is">
    <span class="cap">pale</span>
  </div>
  <div class="pickhint" id="pickhint"></div>
</div>

</body>
