<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mannequin — @chupa/body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,560&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16151a; --bg-2: #1e1c23; --bone: #e9e3d5;
    --bone-dim: #9b958a; --madder: #b3282d; --line: #2e2c34;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--bone);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  header { padding: 18px 22px 10px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--madder); }
  h1 { font-family: "Fraunces", serif; font-weight: 560; font-size: 26px; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  .readout {
    position: absolute; right: 22px; top: 14px; text-align: right;
    font-size: 10.5px; color: var(--bone-dim); line-height: 1.7; pointer-events: none;
  }
  .readout b { color: var(--bone); font-weight: 500; }
  .hint {
    position: absolute; left: 22px; bottom: 14px; font-size: 11px;
    color: var(--bone-dim); letter-spacing: 0.06em; pointer-events: none;
  }
  footer {
    border-top: 1px solid var(--line); background: var(--bg-2);
    padding: 12px 22px 16px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .fabrics { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--bone); font-family: inherit; font-size: 12px;
    padding: 8px 12px 7px; cursor: pointer; text-align: left;
  }
  .chip small { display: block; color: var(--bone-dim); font-size: 10px; margin-top: 2px; }
  .chip.on { border-color: var(--madder); background: rgba(179, 40, 45, 0.10); }
  .grow { flex: 1; }
  .tbtn {
    background: none; border: 1px solid var(--line); border-radius: 8px;
    color: var(--bone-dim); font-family: inherit; font-size: 11px;
    padding: 7px 11px; cursor: pointer;
  }
  .tbtn:hover { color: var(--bone); border-color: var(--bone-dim); }
  .tbtn.on { color: var(--madder); border-color: var(--madder); }
  @media (max-width: 660px) { .readout { display: none; } }
</style>

</head>
<body>

<header>
  <div class="eyebrow">Chupa designer · phase two · @chupa/body</div>
  <h1>Mannequin</h1>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="readout" id="readout"></div>
  <div class="hint">drag to turn · drop cloth on her shoulders</div>
</div>

<footer>
  <div class="fabrics" id="fabrics"></div>
  <div class="grow"></div>
  <button class="tbtn" id="dropBtn">drop cloth</button>
  <button class="tbtn" id="wireBtn">rings</button>
  <button class="tbtn" id="resetBtn">reset</button>
</footer>

</body>
</html>
