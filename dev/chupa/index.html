<style>
  :root {
    --bg: #16151a; --bg-2: #1e1c23; --bone: #e9e3d5;
    --bone-dim: #9b958a; --madder: #b3282d; --line: #2e2c34;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--bone);
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  header { padding: 16px 22px 8px; display: flex; align-items: baseline; gap: 14px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--madder); }
  h1 { font-family: "Fraunces", serif; font-weight: 560; font-size: 24px; }
  h1 .tib { color: var(--bone-dim); font-weight: 400; }
  #stage { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.grabbing { cursor: grabbing; }
  .readout {
    position: absolute; right: 20px; top: 12px; text-align: right;
    font-size: 10.5px; color: var(--bone-dim); line-height: 1.7; pointer-events: none;
  }
  .readout b { color: var(--bone); font-weight: 500; }
  .hint {
    position: absolute; left: 22px; bottom: 12px; font-size: 11px;
    color: var(--bone-dim); letter-spacing: 0.06em; pointer-events: none;
  }
  footer {
    border-top: 1px solid var(--line); background: var(--bg-2);
    padding: 10px 20px 14px; display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap;
  }
  .group { display: flex; flex-direction: column; gap: 6px; }
  .label { font-size: 9.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--bone-dim); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .sw {
    width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
    cursor: pointer; padding: 0;
  }
  .sw.on { border-color: var(--bone); }
  .chip {
    background: none; border: 1px solid var(--line); border-radius: 7px;
    color: var(--bone); font-family: inherit; font-size: 11px;
    padding: 6px 9px 5px; cursor: pointer;
  }
  .chip.on { border-color: var(--madder); background: rgba(179, 40, 45, 0.10); }
  .grow { flex: 1; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100px; height: 3px; border-radius: 2px; background: var(--line); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--bone); border: 2px solid var(--bg-2); cursor: pointer;
  }
  .tbtn {
    background: none; border: 1px solid var(--line); border-radius: 7px;
    color: var(--bone-dim); font-family: inherit; font-size: 11px;
    padding: 6px 10px; cursor: pointer;
  }
  .tbtn:hover { color: var(--bone); border-color: var(--bone-dim); }
  .tbtn.on { color: var(--madder); border-color: var(--madder); }
  @media (max-width: 760px) { .readout { display: none; } footer { gap: 12px; } }
</style>

</head>
<body>

<header>
  <div class="eyebrow">Chupa designer · phase three</div>
  <h1>Chupa <span class="tib">ཕྱུ་པ་</span></h1>
</header>

<div id="stage">
  <canvas id="c"></canvas>
  <div class="readout" id="readout"></div>
  <div class="hint">drag to turn her · pick a colour · change the cloth</div>
</div>

<footer>
  <div class="group">
    <div class="label">Chupa</div>
    <div class="row" id="chupaColours"></div>
    <div class="row" id="chupaFabrics"></div>
  </div>
  <div class="group">
    <div class="label">Honju</div>
    <div class="row" id="honjuColours"></div>
  </div>
  <div class="grow"></div>
  <div class="group">
    <div class="label">Breeze</div>
    <div class="row">
      <input type="range" id="wind" min="0" max="100" step="1" value="25">
      <button class="tbtn" id="motionBtn">motion</button>
      <button class="tbtn" id="pangdenBtn">pangden</button>
      <button class="tbtn" id="bodyBtn">figure</button>
      <button class="tbtn" id="resetBtn">reset</button>
    </div>
  </div>
</footer>
